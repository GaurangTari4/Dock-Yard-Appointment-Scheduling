services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: logistics
      POSTGRES_USER: logistics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  data-loader:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["/app/scripts/bootstrap_database.sh"]
    environment:
      DATABASE_URL: postgresql+psycopg://logistics:${POSTGRES_PASSWORD}@postgres:5432/logistics
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATASET_PROFILE: ${DATASET_PROFILE:-tiny}
      DATASET_SEED: ${DATASET_SEED:-20261022}
    volumes:
      - generated_data:/generated
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://logistics:${POSTGRES_PASSWORD}@postgres:5432/logistics
      SCHEDULING_DEVIATION_MINUTES: ${SCHEDULING_DEVIATION_MINUTES:-0}
    ports:
      - "${API_PORT:-18000}:8000"
    depends_on:
      data-loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      API_BASE_URL: http://api:8000
      PYTHONPATH: /app
    ports:
      - "${DASHBOARD_PORT:-18501}:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  generated_data:
